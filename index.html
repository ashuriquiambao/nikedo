
<!DOCTYPE html>
<html lang="en">
<head>
    <meta name="google-site-verification" content="Lh6oC2e0P2LRy7hEgezL4QDNInbt_4i14-yh--l_Jy0" />
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>NIKEDO | Welcome</title>

    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        body {
            font-family: Arial, sans-serif;
            background: #0f0f14;
            color: white;
            min-height: 100vh;
            overflow: hidden;
        }

        .welcome {
            min-height: 100vh;
            position: relative;

            display: flex;
            justify-content: center;
            align-items: center;

            text-align: center;
            padding: 40px 25px;
            overflow: hidden;

            background:
                radial-gradient(
                    circle at 50% 40%,
                    #3a1833 0%,
                    #211522 25%,
                    #0f0f14 70%
                );
        }

        .welcome::before {
            content: "";
            position: absolute;

            width: 500px;
            height: 500px;

            background: #ff5fa2;
            opacity: 0.08;

            border-radius: 50%;
            filter: blur(100px);

            top: 15%;
            left: 50%;

            transform: translateX(-50%);
        }

        .welcome-content {
            position: relative;
            z-index: 2;
            max-width: 800px;
        }

        .logo-wrapper {
            width: 230px;
            height: 230px;

            margin: 0 auto 30px;

            position: relative;

            display: flex;
            justify-content: center;
            align-items: center;

            animation: logoFloat 4s ease-in-out infinite;
        }

        .logo-wrapper::before {
            content: "";

            position: absolute;

            width: 230px;
            height: 230px;

            border: 1px solid rgba(255, 95, 162, 0.18);

            border-radius: 50%;

            box-shadow:
                0 0 50px rgba(255, 95, 162, 0.08),
                0 0 100px rgba(255, 95, 162, 0.05);

            z-index: 2;

            pointer-events: none;
        }

        .welcome-logo {
            width: 230px;
            height: 230px;

            object-fit: contain;

            display: block;

            border-radius: 25px;

            filter:
                drop-shadow(0 0 15px rgba(255, 95, 162, 0.35))
                drop-shadow(0 0 35px rgba(255, 95, 162, 0.12));

            position: relative;
            z-index: 1;
        }

        @keyframes logoFloat {
            0%, 100% {
                transform: translateY(0);
            }

            50% {
                transform: translateY(-8px);
            }
        }

        .welcome h1 {
            font-size: 52px;
            line-height: 1.1;
            margin-bottom: 20px;
            font-weight: bold;
        }

        .welcome h1 span {
            color: #ff5fa2;
            text-shadow: 0 0 25px rgba(255, 95, 162, 0.25);
        }

        .welcome p {
            max-width: 650px;
            margin: 0 auto 35px;

            color: #cccccc;
            line-height: 1.8;
            font-size: 17px;
        }

        .enter-btn {
            display: inline-flex;
            align-items: center;
            gap: 12px;

            padding: 15px 30px;

            background: #ff5fa2;
            color: white;

            text-decoration: none;

            border-radius: 30px;

            font-weight: bold;
            font-size: 15px;

            box-shadow: 0 8px 25px rgba(255, 95, 162, 0.25);

            transition: 0.3s;
        }

        .enter-btn:hover {
            background: #ff82b6;

            transform: translateY(-4px);

            box-shadow:
                0 12px 30px rgba(255, 95, 162, 0.35);
        }

        .arrow {
            font-size: 18px;
            transition: 0.3s;
        }

        .enter-btn:hover .arrow {
            transform: translateX(5px);
        }

        @media (max-width: 700px) {

            .logo-wrapper {
                width: 170px;
                height: 170px;
                margin-bottom: 25px;
            }

            .logo-wrapper::before {
                width: 170px;
                height: 170px;
            }

            .welcome-logo {
                width: 170px;
                height: 170px;
            }

            .welcome h1 {
                font-size: 35px;
            }

            .welcome p {
                font-size: 15px;
            }
        }
    </style>
</head>

<body>

    <!-- CLICK SOUND -->
    <audio id="nikedoSound" preload="auto">
        <source src="Sound Click.mp3" type="audio/mpeg">
    </audio>

    <!-- OPENING PAGE -->

    <section class="welcome">

        <div class="welcome-content">

            <div class="logo-wrapper">

                <img src="Nikedo1.png"
                     alt="NIKEDO Logo"
                     class="welcome-logo">

            </div>

            <h1>
                Innovation That<br>
                <span>Moves With You</span>
            </h1>

            <p>
                Welcome to NIKEDO — a student innovation project featuring
                a smart laptop prototype designed with proposed features
                that aim to improve convenience and user experience.
                Explore our concept, prototype design, and the ideas behind
                our innovation.
            </p>

            <a href="welcome.html"
               class="enter-btn"
               onclick="playAndGo(event, 'welcome.html')">

                EXPLORE NIKEDO

                <span class="arrow">→</span>

            </a>

        </div>

    </section>

    <script>

        function playAndGo(event, page) {

            event.preventDefault();

            const sound = document.getElementById("nikedoSound");

            sound.volume = 0.35;
            sound.currentTime = 0;

            sound.play()
                .then(() => {

                    sound.onended = function() {
                        window.location.href = page;
                    };

                })
                .catch((error) => {

                    console.log("Sound error:", error);

                    window.location.href = page;

                });
        }

    </script>

</body>
</html>
